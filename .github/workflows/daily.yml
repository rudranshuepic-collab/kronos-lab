# Runs Kronos every weekday evening after NSE closes and saves the forecast ledger (research only).
# The public website is switched off: live named-stock picks are not published (SEBI finfluencer/RA rules).
# Also runs when you edit watchlist.txt, and on demand from the Actions tab ("Run workflow").
name: Daily Kronos update

on:
  schedule:
    - cron: "17 11 * * 1-5"      # 11:17 UTC = 4:47 pm IST, Mon-Fri (off the busy :00/:30 slots)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["watchlist.txt", "app/**", "web/**", "requirements.txt"]

permissions:
  contents: write     # to save the ledger and reality-check cache back to the repo

concurrency:
  group: kronos-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1

      - name: Install
        run: pip install -r requirements.txt

      - name: Run Kronos and build the site
        run: python -m app.build_site

      # Saving the ledger every run is also what keeps GitHub from switching the schedule
      # off (public repos lose scheduled workflows after 60 days without activity).
      - name: Save ledger and reality-check cache
        run: |
          git config user.name "kronos-bot"
          git config user.email "kronos-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Daily ledger update" && git pull --rebase && git push)
