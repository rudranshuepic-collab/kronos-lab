# Runs Kronos every weekday evening after NSE closes and publishes the site to GitHub Pages.
# Also runs when you edit watchlist.txt, and on demand from the Actions tab ("Run workflow").
name: Daily Kronos update

on:
  schedule:
    - cron: "30 11 * * 1-5"      # 11:30 UTC = 5:00 pm IST, Monday to Friday
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["watchlist.txt", "app/**", "web/**", "requirements.txt"]

permissions:
  contents: write     # to save the reality-check cache back to the repo
  pages: write
  id-token: write

concurrency:
  group: kronos-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1

      - name: Install
        run: pip install -r requirements.txt

      - name: Run Kronos and build the site
        run: python -m app.build_site

      - name: Save reality-check cache
        run: |
          git config user.name "kronos-bot"
          git config user.email "kronos-bot@users.noreply.github.com"
          git add data/reality_check.json
          git diff --cached --quiet || (git commit -m "Update reality check" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
